  <path d="M 128 56 L 138 56 L 138 66" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <path d="M 54 116 L 54 126 L 64 126" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
  <path d="M 138 116 L 138 126 L 128 126" fill="none" stroke="#4ade80" stroke-width="3" stroke-linecap="round"/>
