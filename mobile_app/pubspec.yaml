name: agriscan_app
description: "AgriScan AI (Krishi Swasthya Sahayak) - AI-Native Mobile App for Indian Farmers & Agri-Clinics"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Networking & Serialization
  dio: ^5.4.3+1
  json_annotation: ^4.9.0
  
  # Local Persistence & Offline Sync
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3
  
  # Camera, Vision & Image Quality
  camera: ^0.10.6
  image_picker: ^1.1.2
  image: ^4.2.0
  
  # Edge AI / On-Device Inference
  tflite_flutter: ^0.10.4
  
  # Accessibility & Audio
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  
  # UI, Icons, Fonts & Theming
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  lucide_icons: ^0.257.0
  
  # PDF & Printing (Agri-Clinic Mode)
  pdf: ^3.10.8
  printing: ^5.13.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icons/
    - assets/images/
