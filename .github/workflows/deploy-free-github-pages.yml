name: Publish Free B2C PWA Domain on GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    name: Deploy Free PWA Domain
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 & Build PWA
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web_app Assets
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PWA Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web_app'

      - name: Deploy to GitHub Pages Free Domain
        id: deployment
        uses: actions/deploy-pages@v4
