name: Deploy to Firebase Hosting & Cloud Run India (asia-south1 Always Free)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: asia-south1
  CLOUD_RUN_SERVICE: krishi-sahayak-api
  DEFAULT_PROJECT_ID: krishi-sahayak-india-free

jobs:
  deploy-india-always-free:
    name: Deploy PWA Hosting + Cloud Run (Mumbai asia-south1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 & Build B2C PWA Bundle
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Production PWA Assets
        run: npm run build

      - name: Check Google Cloud Service Account Secret
        id: check_creds
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### 🇮🇳 Ready for Google Cloud India (\`asia-south1\` Mumbai) Always-Free Deployment"
              echo "Your repository, Dockerfile, Firebase Hosting config, and hardened Firestore Rules are verified and ready."
              echo ""
              echo "To activate automatic deployment to your own Google account, add **1 GitHub Repository Secret** (\`Settings -> Secrets and variables -> Actions -> New repository secret\`):"
              echo "- **\`GCP_SA_KEY\`**: Paste the JSON key of your Google Cloud Service Account for project **\`krishi-sahayak-india-free\`** (or set \`GCP_PROJECT_ID\` secret if you pick another name)."
              echo "- Optional **\`GEMINI_API_KEY\`**: Paste your free key from [aistudio.google.com](https://aistudio.google.com/apikey)."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud
        if: steps.check_creds.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud SDK
        if: steps.check_creds.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Enable Free-Tier APIs & Ensure Single Always-Free Firestore in Mumbai (asia-south1)
        if: steps.check_creds.outputs.configured == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'krishi-sahayak-india-free' }}
        run: |
          gcloud config set project "$PROJECT_ID"
          gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com firestore.googleapis.com firebase.googleapis.com firebasehosting.googleapis.com
          gcloud firestore databases describe --database="(default)" --project="$PROJECT_ID" >/dev/null 2>&1 || \
            gcloud firestore databases create --database="(default)" --location="${GCP_REGION}" --type=firestore-native --project="$PROJECT_ID"

      - name: Deploy Backend Container to Cloud Run Mumbai (asia-south1 Tier-1 Always Free)
        if: steps.check_creds.outputs.configured == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'krishi-sahayak-india-free' }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
          GA4_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
        run: |
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --source . \
            --project "${PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \
            --memory=512Mi \
            --set-env-vars="GOOGLE_CLOUD_PROJECT=${PROJECT_ID},CLOUD_RUN_REGION=${GCP_REGION},GEMINI_API_KEY=${GEMINI_KEY},GA4_MEASUREMENT_ID=${GA4_ID}"

      - name: Deploy B2C PWA & Hardened Firestore Rules to Firebase Hosting (Spark Always Free)
        if: steps.check_creds.outputs.configured == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'krishi-sahayak-india-free' }}
        run: |
          npx -y firebase-tools@latest deploy --only hosting,firestore:rules,firestore:indexes --project "${PROJECT_ID}"
